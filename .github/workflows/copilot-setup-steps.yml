name: "Copilot Setup Steps"

# Corre automaticamente cuando se modifica este archivo (para validar)
# y se puede ejecutar manualmente desde Actions tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # El job DEBE llamarse exactamente copilot-setup-steps
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20 (para scripts/fetch-browser.js)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + Chromium
        # Fallback de browser real para sitios JS-rendered, UA-blocked
        # o paywalled (lee el lede que renderiza antes de la wall).
        # Usado por scripts/fetch-browser.js cuando un curl normal falla.
        run: |
          npm install --no-save playwright@1.48.0
          npx playwright install chromium --with-deps

      - name: Verify tools available
        run: |
          echo "=== Verificando herramientas ==="
          curl --version | head -1
          jq --version
          gh --version
          node --version
          node -e "require('playwright').chromium.launch().then(b => b.close()).then(() => console.log('playwright ok'))"
          echo "=== Todo listo para el agent ==="
