name: Test YouTube transcript fallback

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video URL to test"
        required: true
        default: "https://www.youtube.com/watch?v=y3hokZ6D6mE"
  push:
    paths:
      - .github/workflows/test-youtube-transcript.yml
      - requirements-copilot.txt
      - scripts/fetch-youtube-transcript.py

permissions:
  contents: read

jobs:
  transcript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install transcript dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-copilot.txt

      - name: Fetch transcript
        env:
          VIDEO_URL: ${{ inputs.video_url || 'https://www.youtube.com/watch?v=y3hokZ6D6mE' }}
        run: |
          mkdir -p .tmp/youtube-transcripts
          set +e
          scripts/fetch-youtube-transcript.py \
            --url "$VIDEO_URL" \
            --out .tmp/youtube-transcripts/test.json
          code=$?
          echo "$code" > .tmp/youtube-transcripts/exit-code.txt
          echo "fetch_exit_code=$code"
          cat .tmp/youtube-transcripts/test.json
          exit 0

      - name: Upload transcript artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-transcript-test
          path: .tmp/youtube-transcripts/

      - name: Summarize transcript result
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path(".tmp/youtube-transcripts/test.json").read_text())
          print("## YouTube transcript test")
          print()
          print("| field | value |")
          print("| --- | --- |")
          for key in [
              "ok",
              "video_id",
              "language",
              "language_code",
              "is_generated",
              "snippets_count",
              "chunks_count",
              "error_type",
          ]:
              print(f"| {key} | {data.get(key)} |")
          if data.get("error"):
              print()
              print("```")
              print(data["error"])
              print("```")
          PY

      - name: Assert transcript is usable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def annotation(message):
              message = " ".join(str(message).split())[:1000]
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=YouTube transcript test failed::{message}")

          data = json.loads(Path(".tmp/youtube-transcripts/test.json").read_text())
          print(json.dumps({
              "ok": data.get("ok"),
              "video_id": data.get("video_id"),
              "language": data.get("language"),
              "language_code": data.get("language_code"),
              "is_generated": data.get("is_generated"),
              "snippets_count": data.get("snippets_count"),
              "chunks_count": data.get("chunks_count"),
          }, ensure_ascii=False, indent=2))

          if data.get("ok") is not True:
              annotation(f"{data.get('error_type')}: {data.get('error')}")
              raise SystemExit(1)
          if data.get("snippets_count", 0) <= 100:
              annotation(f"too few snippets: {data.get('snippets_count')}")
              raise SystemExit(1)
          if data.get("chunks_count", 0) <= 3:
              annotation(f"too few chunks: {data.get('chunks_count')}")
              raise SystemExit(1)
          PY
