name: Publicar el reporte

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, review_requested]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: publicar-${{ github.event.pull_request.number }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    if: contains(fromJson('["Copilot","app/copilot-swe-agent","copilot-swe-agent[bot]"]'), github.event.pull_request.user.login)
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Guardrails
        id: gate
        run: |
          FILES=$(gh pr view "$PR" -R "$REPO" --json files --jq '.files[].path')
          echo "Archivos: $FILES"
          if [ -z "$FILES" ]; then echo "PR vacío todavía"; exit 0; fi
          if [ "$(wc -l <<< "$FILES")" != 1 ] || ! [[ "$FILES" =~ ^_posts/[0-9]{4}-[0-9]{2}-[0-9]{2}-hoy\.md$ ]]; then
            echo "reason=el PR tiene que tocar exactamente un archivo _posts/AAAA-MM-DD-hoy.md" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! awk '/^---$/{c++; next} c==1' "$FILES" | python3 -c 'import sys, yaml; d = yaml.safe_load(sys.stdin); assert d["title"] and d["window"] and d["top_stories"]'; then
            echo "reason=frontmatter inválido o incompleto en $FILES" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(gh pr view "$PR" -R "$REPO" --json reviews --jq '[.reviews[] | select(.state=="CHANGES_REQUESTED")] | length')" != 0 ]; then
            echo "reason=hay una review humana pidiendo cambios" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Mergear
        if: steps.gate.outputs.ok == 'true'
        run: |
          [ "$(gh pr view "$PR" -R "$REPO" --json isDraft --jq .isDraft)" = true ] && gh pr ready "$PR" -R "$REPO"
          gh pr merge "$PR" -R "$REPO" --squash --delete-branch
          gh issue list -R "$REPO" --label dia --state open --json number --jq '.[].number' | xargs -rn1 gh issue close -R "$REPO" --comment "Publicado en el PR #$PR."
      - name: Avisar
        if: steps.gate.outputs.reason != ''
        run: gh pr comment "$PR" -R "$REPO" --body "No se publica solo: ${{ steps.gate.outputs.reason }}. Queda para que lo mire una persona."
