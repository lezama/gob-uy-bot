name: Publicar el reporte

on:
  pull_request_target:
    types: [synchronize, ready_for_review]

permissions: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    if: contains(fromJson('["Copilot","app/copilot-swe-agent","copilot-swe-agent[bot]"]'), github.event.pull_request.user.login)
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Guardrails
        id: gate
        run: |
          FILES=$(gh pr diff "$PR" --name-only)
          echo "Archivos: $FILES"
          if ! [[ "$FILES" =~ ^_posts/[0-9]{4}-[0-9]{2}-[0-9]{2}-hoy\.md$ ]]; then
            echo "reason=el PR tiene que tocar exactamente un archivo _posts/AAAA-MM-DD-hoy.md" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh api "repos/$GH_REPO/contents/$FILES?ref=$SHA" --jq .content | base64 -d | awk '/^---$/{c++; next} c==1' \
            | python3 -c 'import sys, yaml; d = yaml.safe_load(sys.stdin); assert d["title"] and d["window"] and d["top_stories"]' \
            || echo "reason=frontmatter inválido o incompleto en $FILES" >> "$GITHUB_OUTPUT"
      - name: Mergear
        if: steps.gate.outputs.reason == ''
        run: |
          read -r STATE DRAFT < <(gh pr view "$PR" --json state,isDraft --jq '[.state, .isDraft] | @tsv')
          [ "$STATE" = OPEN ] || exit 0
          [ "$DRAFT" = true ] && gh pr ready "$PR"
          gh pr merge "$PR" --squash --delete-branch
          gh issue list --label dia --state open --json number --jq '.[].number' | xargs -rn1 gh issue close --comment "Publicado en el PR #$PR."
      - name: Avisar
        if: steps.gate.outputs.reason != ''
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          gh pr comment "$PR" --body "No se publica solo: $REASON. Queda para que lo mire una persona."
